<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Campus Marketplace</title>
    <link rel="icon" href="../pictures/icon pic.png" type="image/png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="register-page">
      <section class="register-container">
        <header class="register-header">
          <h1>Create a New Password</h1>
          <p>Choose a new password for your account.</p>
        </header>

        <form id="resetPasswordForm" class="register-form" novalidate>
          <input type="hidden" id="token" name="token" />

          <div class="form-group">
            <label for="password">New password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
            />
            <p id="passwordError" class="field-error"></p>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter password"
              autocomplete="new-password"
              required
            />
            <p id="confirmPasswordError" class="field-error"></p>
          </div>

          <p id="formMessage" class="form-message"></p>

          <button type="submit" class="register-button">Update password</button>

          <p class="login-link">
            <a href="login.html">Back to login</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/reset-password.js"></script>
  </body>
</html>
