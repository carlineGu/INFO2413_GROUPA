<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account / Profile | Campus Marketplace</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/navbar.css" />
<style>
  body { margin: 0; }
  #root { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="navbar"></div>
<div id="root"></div>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// ─── Profile content ─────────────────────────────────────────────────────

// ─── Shared building blocks ────────────────────────────────────────────────

function getStoredUser() {
  return window.CampusMarketplace.getCurrentUser();
}

function getDisplayName(user) {
  if (!user) return "Guest";
  if (user.fullName) return user.fullName;
  if (user.name) return user.name;
  if (user.firstName || user.lastName) {
    return `${user.firstName || ""} ${user.lastName || ""}`.trim();
  }
  return "User";
}

function getEmail(user) {
  return user?.email || "";
}

function ImgBox() {
  return (
    <div className="w-full h-full border border-[#704050] relative bg-white overflow-hidden">
      <svg width="100%" height="100%" className="absolute inset-0">
        <line x1="0" y1="0" x2="100%" y2="100%" stroke="#704050" strokeWidth="1" />
        <line x1="100%" y1="0" x2="0" y2="100%" stroke="#704050" strokeWidth="1" />
      </svg>
    </div>
  );
}

// ─── Profile page ───────────────────────────────────────────────────────────

function Profile() {
  const [tab, setTab] = useState("listings");
  const [user, setUser] = useState(() => getStoredUser());
  const [myListings, setMyListings] = useState([]);
  const [savedListings, setSavedListings] = useState([]);
  const [profilePic, setProfilePic] = useState(() => localStorage.getItem("profilePic") || null);
  const tabs = ["listings", "saved", "settings"];

  function handleProfilePicChange(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      setProfilePic(dataUrl);
      localStorage.setItem("profilePic", dataUrl);
    };
    reader.readAsDataURL(file);
  }

  function handleRemoveProfilePic() {
    setProfilePic(null);
    localStorage.removeItem("profilePic");
  }

  useEffect(() => {
    const syncUser = async () => {
      const storedUser = getStoredUser();
      setUser(storedUser);

      if (!storedUser) {
        window.location.replace("login.html");
        return;
      }

      try {
        const params = new URLSearchParams();

        if (storedUser.userId) {
          params.set("userId", storedUser.userId);
        } else if (storedUser.email) {
          params.set("email", storedUser.email);
        }

        const freshUser = await window.CampusMarketplace.request(`user/me?${params.toString()}`);
        const [listingData, favoriteData, publicProfile] = await Promise.all([
          window.CampusMarketplace.request(`listing?ownerId=${freshUser.userId}`),
          window.CampusMarketplace.request(`favorite?userId=${freshUser.userId}`),
          window.CampusMarketplace.request(`user/${freshUser.userId}`)
        ]);
        setUser({ ...freshUser, ...publicProfile });
        setMyListings(listingData || []);
        setSavedListings(favoriteData || []);
      } catch (error) {
        console.error("Profile fetch failed:", error);
      }
    };

    syncUser();
    window.addEventListener("storage", syncUser);
    return () => window.removeEventListener("storage", syncUser);
  }, []);

  async function handleDeleteListing(listingId) {
    if (!user?.userId) {
      console.error("Delete failed: missing user");
      return;
    }

    try {
      await window.CampusMarketplace.request(`listing/${listingId}`, {
        method: "DELETE",
        body: { userId: user.userId }
      });
      setMyListings((current) => current.filter((item) => item.listingId !== listingId));
    } catch (error) {
      console.error("Delete listing error:", error);
    }
  }

  async function handleUnfavorite(listingId) {
    if (!user?.userId) return;

    try {
      await window.CampusMarketplace.request(`favorite/${listingId}?userId=${user.userId}`, { method: "DELETE" });
      setSavedListings((current) => current.filter((item) => item.listingId !== listingId));
    } catch (error) {
      console.error("Unfavorite error:", error);
    }
  }

  const displayName = getDisplayName(user);
  const email = getEmail(user);
  const rating = user?.reviewCount > 0
    ? `${Number(user.averageRating || 0).toFixed(1)} \u2605 (${user.reviewCount})`
    : "No ratings yet";

  return (
    <>
      <div className="px-4 py-6 max-w-xl mx-auto">
          <div className="border border-[#704050] p-4 flex gap-4 mb-4 bg-white">
          <div className="w-16 h-16 shrink-0">
            {profilePic ? (
              <img src={profilePic} alt="Profile" className="w-full h-full object-cover border border-[#704050]" />
            ) : (
              <ImgBox />
            )}
          </div>
          <div className="flex-1">
            <h1 className="font-semibold text-sm">{displayName}</h1>
            <div className="text-xs text-gray-500">{email || "No email on file"}</div>
            <div className="flex gap-6 text-xs mt-2">
              <div>Listings: <b>{myListings.length}</b></div>
              <div>Rating: <b>{rating}</b></div>
            </div>
          </div>
          <div className="flex flex-col gap-2">
            <a
              href="login.html"
              onClick={() => {
                window.CampusMarketplace.clearCurrentUser();
              }}
              className="border border-[#704050] px-2 py-1 text-xs h-fit text-center text-[#704050]"
            >
              Log out
            </a>
          </div>
        </div>

        <div className="flex border border-[#704050] mb-4 bg-white">
          {tabs.map((t) => (
            <button
              key={t}
              onClick={() => setTab(t)}
              className={`flex-1 py-1.5 text-xs capitalize border-r border-[#704050] last:border-0 transition-colors ${tab === t ? "bg-[#704050] text-white" : "bg-white hover:bg-[rgba(0,0,0,0.05)]"}`}
            >
              {t}
            </button>
          ))}
        </div>

        {tab === "listings" && (
          <>
            <a
              href="create_listing.html"
              className="block w-full text-center border border-[#704050] px-2 py-2 text-xs mb-3 bg-[#704050] text-white hover:bg-[#5a3340]"
            >
              + Create Listing
            </a>
            {myListings.length === 0 ? (
              <div className="border border-[#704050] p-8 text-center text-xs text-gray-400 bg-white">
                No listings yet
              </div>
            ) : (
              <div className="grid grid-cols-3 gap-2">
                {myListings.map((item) => (
                    <div key={item.listingId} className="border border-[#704050] bg-white">
                     <div className="h-24 overflow-hidden bg-gray-50">
                        {item.photo ? (
                            <img src={item.photo} alt={item.title} className="w-full h-full object-cover" />
                        ) : (
                            <ImgBox />
                       )}
                 </div>
                 <div className="p-1.5">
                    <div className="flex items-start justify-between gap-2 mb-1">
                      <div className="text-xs">{item.title}</div>
                      <button
                        type="button"
                        onClick={() => handleDeleteListing(item.listingId)}
                        className="text-[10px] border border-[#704050] px-2 py-1 bg-white hover:bg-[#704050] hover:text-white"
                      >
                        Delete
                      </button>
                    </div>
                    <div className="text-xs font-bold">${Number(item.price).toFixed(2)}</div>
                 </div>
             </div>
            ))}
              </div>
            )}
          </>
        )}

        {tab === "saved" && (
          savedListings.length === 0 ? (
            <div className="border border-[#704050] p-8 text-center text-xs text-gray-400 bg-white">
              No saved items
            </div>
          ) : (
            <div className="grid grid-cols-3 gap-2">
              {savedListings.map((item) => (
                <div key={item.listingId} className="border border-[#704050] bg-white">
                  <a href={`listing.html?id=${item.listingId}`} className="block">
                    <div className="h-20 overflow-hidden bg-gray-50">
                      {item.photo ? (
                        <img src={item.photo} alt={item.title} className="w-full h-full object-cover" />
                      ) : (
                        <ImgBox />
                      )}
                    </div>
                    <div className="p-1.5">
                      <div className="text-xs">{item.title}</div>
                      <div className="text-xs font-bold">${Number(item.price).toFixed(2)}</div>
                    </div>
                  </a>
                  <button
                    type="button"
                    onClick={() => handleUnfavorite(item.listingId)}
                      className="w-full text-[10px] border-t border-[#704050] px-2 py-1 bg-white hover:bg-[#704050] hover:text-white"
                  >
                    Remove
                  </button>
                </div>
              ))}
            </div>
          )
        )}

        {tab === "settings" && (
            <div className="border border-[#704050] p-4 bg-white">
            <div className="mb-5">
              <div className="text-xs mb-2">Profile Picture</div>
              <div className="flex items-center gap-4">
                <div className="w-16 h-16 shrink-0">
                  {profilePic ? (
                  <img src={profilePic} alt="Profile" className="w-full h-full object-cover border border-[#704050]" />
                  ) : (
                    <ImgBox />
                  )}
                </div>
                <div className="flex flex-col gap-2">
                  <label className="border border-[#704050] px-3 py-1.5 text-xs bg-white text-center cursor-pointer text-[#704050] hover:bg-[#f5f5f5]">
                    Upload Photo
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleProfilePicChange}
                      className="hidden"
                    />
                  </label>
                  {profilePic && (
                    <button
                      onClick={handleRemoveProfilePic}
                      className="border border-[#704050] px-3 py-1.5 text-xs bg-white text-[#704050] hover:bg-[#f5f5f5]"
                    >
                      Remove Photo
                    </button>
                  )}
                </div>
              </div>
            </div>
            <div className="border-t border-[#704050] pt-4">
              <div className="text-xs font-semibold mb-2">Account details</div>
              <dl className="text-xs space-y-2">
                <div>
                  <dt className="text-gray-500">Name</dt>
                  <dd>{displayName}</dd>
                </div>
                <div>
                  <dt className="text-gray-500">Email</dt>
                  <dd>{email || "No email on file"}</dd>
                </div>
              </dl>
              <p className="text-xs text-gray-500 mt-3">
                Account details are read-only in this class-project build.
              </p>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

// ─── Public profile (viewing another user, e.g. a seller) ─────────────────

function PublicProfile({ userId }) {
  const [profile, setProfile] = useState(null);
  const [listings, setListings] = useState([]);
  const [notFound, setNotFound] = useState(false);

  useEffect(() => {
    async function load() {
      try {
        const profileData = await window.CampusMarketplace.request(`user/${userId}`);
        setProfile(profileData);

        const listingData = await window.CampusMarketplace.request(`listing?ownerId=${userId}`);
        setListings(listingData || []);
      } catch (error) {
        console.error("Public profile fetch failed:", error);
        setNotFound(true);
      }
    }

    load();
  }, [userId]);

  if (notFound) {
    return (
      <>
        <div className="px-4 py-6 max-w-xl mx-auto text-center text-sm text-gray-500">
          This user could not be found.
        </div>
      </>
    );
  }

  if (!profile) {
    return (
      <>
        <div className="px-4 py-6 max-w-xl mx-auto text-center text-sm text-gray-500">
          Loading profile...
        </div>
      </>
    );
  }

  const ratingLabel = profile.averageRating ? `${profile.averageRating} \u2605 (${profile.reviewCount})` : "No ratings yet";

  return (
    <>
      <div className="px-4 py-6 max-w-xl mx-auto">
        <div className="border border-[#704050] p-4 flex gap-4 mb-4 bg-white">
          <div className="w-16 h-16 shrink-0">
            <ImgBox />
          </div>
          <div className="flex-1">
            <h1 className="font-semibold text-sm">{profile.fullName}</h1>
            <div className="flex gap-6 text-xs mt-2">
              <div>Listings: <b>{profile.listingCount}</b></div>
              <div>Rating: <b>{ratingLabel}</b></div>
            </div>
          </div>
        </div>

        <div className="text-xs font-semibold mb-2">Active Listings</div>
        {listings.length === 0 ? (
          <div className="border border-[#704050] p-8 text-center text-xs text-gray-400 bg-white">
            No active listings
          </div>
        ) : (
          <div className="grid grid-cols-3 gap-2">
            {listings.map((item) => (
              <a key={item.listingId} href={`listing.html?id=${item.listingId}`} className="border border-[#704050] bg-white block">
                <div className="h-24 overflow-hidden bg-gray-50">
                  {item.photo ? (
                    <img src={item.photo} alt={item.title} className="w-full h-full object-cover" />
                  ) : (
                    <ImgBox />
                  )}
                </div>
                <div className="p-1.5">
                  <div className="text-xs">{item.title}</div>
                  <div className="text-xs font-bold">${Number(item.price).toFixed(2)}</div>
                </div>
              </a>
            ))}
          </div>
        )}
      </div>
    </>
  );
}

function ProfilePage() {
  const viewedUserId = new URLSearchParams(window.location.search).get("id");
  const currentUser = getStoredUser();
  const isViewingOther = viewedUserId && String(viewedUserId) !== String(currentUser?.userId);

  return isViewingOther ? <PublicProfile userId={viewedUserId} /> : <Profile />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ProfilePage />);
</script>
</body>
</html>
