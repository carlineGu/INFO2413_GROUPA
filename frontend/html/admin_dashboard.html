<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Campus Marketplace</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <div class="admin-header-left">
      <button type="button" id="adminMenuButton" aria-label="Menu" aria-controls="adminSideMenu" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="admin-header-titles">
        <h1>Admin Dashboard</h1>
        <p>Campus Marketplace</p>
      </div>
    </div>
    <button type="button" id="signOutButton" class="sign-out-button">Sign Out</button>
  </header>

  <main class="admin-main">
    <div class="page-title">
      <h2>Dashboard</h2>
      <p>Manage listings, users, and reports across the platform.</p>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-number" id="statListings">&ndash;</div>
        <div class="stat-label">Total Listings</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statRegisteredUsers">&ndash;</div>
        <div class="stat-label">Registered Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statPendingReports">&ndash;</div>
        <div class="stat-label">Pending Reports</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statTotalReports">&ndash;</div>
        <div class="stat-label">Total Reports</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="statOpenMessages">&ndash;</div>
        <div class="stat-label">Open Support Messages</div>
      </div>
    </div>

  <div class="quick-access-section">
    
  <h3>Quick Access</h3>
    <div class="quick-access-grid">
    <a href="user_listing_reports.html" class="quick-access-card">Review Reports</a>
    <a href="admin_marketplace_activity.html" class="quick-access-card">Marketplace Activity</a>
    <a href="admin_listings.html" class="quick-access-card">Manage Listings</a>
    <a href="admin_users.html" class="quick-access-card">Manage Users</a>
    <a href="admin_support_messages.html" class="quick-access-card">Support Messages</a>
  </div>

 </div>
  </main>

  <script src="../js/api.js" defer></script>
  <script src="../js/admin_dashboard.js" defer></script>
    <script src="../js/admin_navbar.js" defer></script>
</body>
</html>
