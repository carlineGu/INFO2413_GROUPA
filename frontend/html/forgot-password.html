<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Campus Marketplace</title>
    <link rel="icon" href="../pictures/icon pic.png" type="image/png" />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
  <main class="forgot-password-page">
    <section class="forgot-password-container">
      <header class="forgot-password-header">
        <p class="forgot-password-intro">Enter your email to receive a reset link.</p>
      </header>

      <form id="forgotPasswordForm" class="forgot-password-card forgot-password-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="name@student.kpu.ca"
            autocomplete="email"
            required
          />
          <p id="emailError" class="field-error"></p>
        </div>

        <p id="formMessage" class="form-message"></p>

        <button type="submit" class="register-button">Send reset link</button>

        <p class="forgot-password-link">
          <a href="login.html">Back to login</a>
        </p>
      </form>
    </section>
  </main>

    <script src="../js/api.js"></script>
    <script src="../js/forgot-password.js"></script>
  </body>
</html>
