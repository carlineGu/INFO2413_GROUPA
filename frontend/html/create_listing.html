<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Listing | Campus Marketplace</title>
  <link rel="icon" href="../pictures/icon pic.png" type="image/png">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/create_listing.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="create-listing-page">
    <div class="create-listing-heading">
      <a href="index.html">&larr; Back to Listings</a>
      <h1>Create Listing</h1>
      <p>Add clear details so buyers know exactly what you are offering.</p>
    </div>

    <form id="create-listing-form" class="create-listing-form" novalidate>
      <fieldset class="create-listing-section">
        <legend>Photos <span>(up to 4)</span></legend>
        <p class="field-help">PNG, JPEG, or WebP. Maximum 4 MB per photo.</p>
        <div class="photo-grid">
          <label class="photo-upload">
            <input type="file" accept="image/png,image/jpeg,image/webp" data-photo-slot="0">
            <span class="photo-placeholder"><strong>+</strong>Add photo</span>
            <img class="photo-preview" alt="First listing preview">
          </label>
          <label class="photo-upload">
            <input type="file" accept="image/png,image/jpeg,image/webp" data-photo-slot="1">
            <span class="photo-placeholder"><strong>+</strong>Add photo</span>
            <img class="photo-preview" alt="Second listing preview">
          </label>
          <label class="photo-upload">
            <input type="file" accept="image/png,image/jpeg,image/webp" data-photo-slot="2">
            <span class="photo-placeholder"><strong>+</strong>Add photo</span>
            <img class="photo-preview" alt="Third listing preview">
          </label>
          <label class="photo-upload">
            <input type="file" accept="image/png,image/jpeg,image/webp" data-photo-slot="3">
            <span class="photo-placeholder"><strong>+</strong>Add photo</span>
            <img class="photo-preview" alt="Fourth listing preview">
          </label>
        </div>
      </fieldset>

      <div class="form-grid">
        <label class="form-field form-field-wide">
          <span>Title</span>
          <input id="listing-title" name="title" type="text" maxlength="100" required placeholder="Used Calculus Textbook">
        </label>

        <label class="form-field">
          <span>Price</span>
          <input id="listing-price" name="price" type="number" min="0.01" max="99999999.99" step="0.01" required placeholder="0.00">
        </label>

        <label class="form-field">
          <span>Department</span>
          <select id="listing-department" name="department" required>
            <option value="">Select a department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Business">Business</option>
            <option value="Engineering">Engineering</option>
            <option value="General">General</option>
          </select>
        </label>

        <label class="form-field">
          <span>Category</span>
          <select id="listing-category" name="category" required>
            <option value="">Select a category</option>
            <option value="Books &amp; Textbooks">Books &amp; Textbooks</option>
            <option value="Electronics">Electronics</option>
            <option value="Dorm &amp; Furniture">Dorm &amp; Furniture</option>
            <option value="Clothing &amp; Accessories">Clothing &amp; Accessories</option>
          </select>
        </label>

        <label class="form-field">
          <span>Condition</span>
          <select id="listing-condition" name="condition">
            <option value="">Select a condition</option>
            <option value="NEW">New</option>
            <option value="LIKE NEW">Like New</option>
            <option value="GOOD">Good</option>
            <option value="FAIR">Fair</option>
            <option value="USED">Used</option>
          </select>
        </label>

        <label class="form-field">
          <span>Meetup location</span>
          <select id="listing-location" name="location">
            <option value="">Select a location</option>
            <option value="Richmond Campus">Richmond Campus</option>
            <option value="Surrey Campus">Surrey Campus</option>
            <option value="Langley Campus">Langley Campus</option>
          </select>
        </label>

        <label class="form-field form-field-wide">
          <span>Description</span>
          <textarea id="listing-description" name="description" maxlength="3000" required placeholder="Condition, details, and anything else a buyer should know."></textarea>
        </label>
      </div>

      <p id="create-listing-feedback" class="form-feedback" role="status" aria-live="polite"></p>
      <button id="publish-listing-button" class="publish-button" type="submit">Publish Listing</button>
    </form>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/create-listing.js"></script>
</body>
</html>
